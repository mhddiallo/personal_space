services:
  - type: web
    name: espace-personnel-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false # colle l'URL de connexion Supabase (Session pooler, port 5432) dans le dashboard Render
      - key: SUPABASE_URL
        sync: false # ex: https://xxxx.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false # clé "service_role" du projet Supabase (Settings > API)
      - key: SUPABASE_PHOTOS_BUCKET
        value: contact-photos
      - key: CORS_ORIGINS
        sync: false # ex: https://espace-personnel.onrender.com (URL du site statique ci-dessous)

  - type: web
    name: espace-personnel-app
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        sync: false # ex: https://espace-personnel-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
